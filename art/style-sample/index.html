<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style sample</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --paper: #e6e1d8;
      --panel: #f4f0e8;
      --line: #c9c1b4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem 0.55rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    p.note { margin: 0.15rem 0 0; font-size: 0.82rem; color: #5c564c; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    button {
      font: inherit;
      font-size: 0.92rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.28rem 0.8rem;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--panel);
      border-color: var(--ink);
    }
    button:disabled { opacity: 0.35; cursor: default; }
    #faces-page { align-self: center; font-size: 0.85rem; color: #5c564c; }
    #view { position: relative; height: calc(100% - 4.4rem); }
    canvas { display: block; width: 100%; height: 100%; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .tag {
      position: absolute;
      transform: translate(-50%, 0);
      text-align: center;
      font-size: 0.78rem;
      line-height: 1.15;
      color: var(--ink);
      white-space: nowrap;
    }
    .tag b { display: block; font-weight: 600; }
    #status {
      position: absolute;
      left: 1rem;
      bottom: 0.8rem;
      margin: 0;
      font-size: 0.85rem;
    }
    body.editing {
      display: grid;
      height: 100%;
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-columns: minmax(0, 1fr) 26rem;
    }
    body.editing header { grid-column: 1 / -1; }
    body.editing #view { height: auto; min-height: 0; }
    body.editing #close,
    body.editing #faces-prev,
    body.editing #faces-next,
    body.editing #faces-page { display: none; }
    #editor {
      overflow: hidden;
      background: var(--panel);
      border-left: 1px solid var(--line);
      padding: 0.85rem 1rem 1rem;
    }
    body.editing #editor {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .editor-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }
    .editor-person {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.92rem;
    }
    #editor select {
      font: inherit;
      font-size: 0.88rem;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      padding: 0.28rem 0.45rem;
      max-width: 11rem;
    }
    .editor-note { margin: 0.45rem 0 0.2rem; font-size: 0.78rem; color: #5c564c; }
    #edit-sliders { overflow: auto; min-height: 0; flex: 1; padding-right: 0.2rem; }
    #edit-sliders h3 {
      margin: 0.85rem 0 0.15rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5c564c;
    }
    .hair-note {
      margin: 0.15rem 0 0.35rem;
      font-size: 0.75rem;
      line-height: 1.3;
      color: #5c564c;
    }
    .hair-line {
      display: grid;
      grid-template-columns: 5.4rem minmax(0, 1fr);
      align-items: center;
      gap: 0.45rem;
      margin: 0.28rem 0;
      font-size: 0.82rem;
    }
    .hair-line select { max-width: none; width: 100%; }
    #genetic-hair {
      display: block;
      width: 2.6rem;
      height: 1.15rem;
      border: 1px solid var(--line);
      border-radius: 0.2rem;
      justify-self: start;
    }
    .hair-dye {
      grid-template-columns: 5.4rem auto auto;
      justify-content: start;
      margin-top: 0.15rem;
      padding: 0.35rem 0.45rem;
      border: 1px dashed var(--line);
      border-radius: 0.35rem;
    }
    .hair-dye input[type="checkbox"] { justify-self: start; }
    .hair-dye input[type="color"] {
      width: 2.6rem;
      height: 1.35rem;
      padding: 0;
      border: 1px solid var(--line);
      background: #fff;
      justify-self: start;
    }
    .slider {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0.08rem;
      margin: 0.55rem 0 0.1rem;
      font-size: 0.82rem;
    }
    .slider input[type="range"] {
      width: 100%;
      margin: 0.08rem 0 0;
      accent-color: var(--ink);
    }
    .slider output {
      color: #5c564c;
      font-size: 0.78rem;
      line-height: 1.25;
    }
    .slider.is-off { opacity: 0.4; }
    .tick {
      position: relative;
      height: 1.15rem;
      margin: 0 0.55rem;
    }
    .tick i {
      position: absolute;
      left: 50%;
      top: -0.42rem;
      width: 1px;
      height: 0.55rem;
      background: #6d675c;
      transform: translateX(-50%);
    }
    .tick b {
      position: absolute;
      left: 50%;
      top: 0.15rem;
      transform: translateX(-50%);
      font-size: 0.68rem;
      font-weight: 500;
      color: #6d675c;
      white-space: nowrap;
    }
    .contract-wrap {
      overflow: auto;
      max-height: 38%;
      margin-top: 0.6rem;
      padding-top: 0.55rem;
      border-top: 1px solid var(--line);
    }
    .contract-wrap h2 { margin: 0 0 0.35rem; font-size: 0.95rem; font-weight: 600; }
    #edit-contract {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.1rem 0.7rem;
      margin: 0;
      font-size: 0.72rem;
    }
    #edit-contract dt { margin: 0; color: #5c564c; }
    #edit-contract dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.36.4/build/index.js"
    }
  }
  </script>
</head>
<body>
  <header>
    <div>
      <h1>Style sample</h1>
      <p class="note" id="caption">Loading the family.</p>
    </div>
    <div class="controls">
      <button type="button" id="style-a" aria-pressed="true">A Realistic</button>
      <button type="button" id="style-b" aria-pressed="false">B Toon</button>
      <button type="button" id="style-c" aria-pressed="false">C Flat</button>
      <button type="button" id="faces-prev" hidden>Previous</button>
      <button type="button" id="close" aria-pressed="false">Faces</button>
      <button type="button" id="faces-next" hidden>Next</button>
      <span id="faces-page" hidden></span>
    </div>
  </header>
  <div id="view">
    <canvas id="stage"></canvas>
    <div id="labels"></div>
    <p id="status"></p>
  </div>
  <aside id="editor" hidden>
    <div class="editor-bar">
      <label class="editor-person">Person
        <select id="edit-person"></select>
      </label>
      <button type="button" id="edit-reset">Reset</button>
    </div>
    <p class="editor-note">Preview only. Nothing is written back.</p>
    <div id="edit-sliders"></div>
    <div class="contract-wrap">
      <h2>Contract</h2>
      <dl id="edit-contract"></dl>
    </div>
  </aside>
  <script type="module" src="./main.js"></script>
</body>
</html>
