# The gate (ADR-0000): required check on main. It runs exactly `cargo xtask ci`,
# the same command as the pre-push hook. No paths-ignore: a required check that is
# skipped blocks the PR, and docs/adr is on the protected list (ADR-0000).
# Never edit this file to make a merge possible (ADR-0000, exception to A3).
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and arm64: the measured determinism differences run along this line.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustc --version
      - name: Gate
        run: cargo xtask ci
