# Weekly gate on macOS arm64 (ADR-0000, ADR-0003): the third supported target, and the
# reference check of the known-answer tests. Not a required check; daily work on the
# Mac is covered by the pre-push hook.
name: weekly-macos

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the gate compares results with the merge base with
          # origin/main (ADR-0003 6.4 and 6.5).
          fetch-depth: 0
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      # Node for the web build of the gate, its major from web/.nvmrc (ADR-0021 section 4);
      # the image's own Node is another major.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      # The Chromium headless shell of the pinned playwright-core for the browser smoke
      # test of the gate; weekly, so without a cache.
      - name: Install the browser
        run: cargo xtask browser
      - name: Gate
        run: cargo xtask ci
      # The reference columns of the known-answer tests, recomputed with the pinned
      # Python tools (ADR-0003). Runs even when the gate fails: the two answer
      # different questions.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: always()
        with:
          python-version: "3.12.10"
      - name: Reference check
        if: always()
        run: |
          python -m venv "$RUNNER_TEMP/kat-venv"
          "$RUNNER_TEMP/kat-venv/bin/pip" install --quiet --require-hashes -r tools/requirements.txt
          KAT_PYTHON="$RUNNER_TEMP/kat-venv/bin/python" cargo xtask kat-verify-reference
